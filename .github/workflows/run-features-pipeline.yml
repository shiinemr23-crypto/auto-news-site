name: Run featured articles pipeline

on:
  schedule:
    # Runs every 8 hours, offset 4 hours from the regular pipeline so
    # they don't compete for the same runner slot. Cron is in UTC.
    - cron: "0 4,12,20 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  run-features-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run featured articles pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main_features.py
